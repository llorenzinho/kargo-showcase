apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: kargo-showcase
  namespace: kargo-showcase
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  promotionPolicies:
    - stageSelector:
        name: dev
      autoPromotionEnabled: true
    - stageSelector:
        name: staging
      autoPromotionEnabled: true
    - stageSelector:
        name: prod
      autoPromotionEnabled: false
