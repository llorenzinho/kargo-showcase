# Copy this file to credentials.yaml, fill in a GitHub username and a PAT with
# write access to the repository, then apply it after the Kargo Project exists:
#
#   kubectl apply -f gitops/apps/kargo-showcase/credentials.yaml
#
# PAT permissions:
# - fine-grained: Contents: Read and write (Metadata: Read-only is automatic)
# - classic:      public_repo for this public repository (repo also works)
#
# Uncomment BOTH username and password and replace the placeholders below.
# YAML comments are ignored by Kargo, so commented keys are not credentials.
#
# credentials.yaml is ignored by Git.
apiVersion: v1
kind: Secret
metadata:
  name: kargo-showcase-git
  namespace: kargo-showcase
  labels:
    kargo.akuity.io/cred-type: git
type: Opaque
stringData:
  repoURL: https://github.com/llorenzinho/kargo-showcase.git
  # username: REPLACE_WITH_GITHUB_USERNAME
  # password: REPLACE_WITH_GITHUB_PAT
