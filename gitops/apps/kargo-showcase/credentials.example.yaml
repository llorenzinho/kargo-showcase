# Copy this file to credentials.yaml, fill in a GitHub username and a PAT with
# write access to the repository, then apply it after the Kargo Project exists:
#
#   kubectl apply -f gitops/apps/kargo-showcase/kargo/credentials.yaml
#
# credentials.yaml is ignored by Git.
apiVersion: v1
kind: Secret
metadata:
  name: kargo-showcase-git
  namespace: kargo-showcase
  labels:
    kargo.akuity.io/cred-type: git
type: Opaque
stringData:
  repoURL: https://github.com/llorenzinho/kargo-showcase.git
  # username: REPLACE_WITH_GITHUB_USERNAME
  # password: REPLACE_WITH_GITHUB_PAT
