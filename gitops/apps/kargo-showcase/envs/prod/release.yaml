# Git-driven release marker used by the lab.
#
# Build and load images with: task image:build VERSION=v2
# There is no registry to poll; kind load makes the tag available locally.
# Bump this file to create new Freight, then let Kargo promote it through
# dev, staging and prod. Do not edit the envs/*/release.yaml files directly.
image:
  tag: v2

podLabels:
  kargo.akuity.io/release: v2
