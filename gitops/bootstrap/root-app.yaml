apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kargo-showcase-gitops
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/llorenzinho/kargo-showcase.git
      targetRevision: main
      path: gitops/argocd
    - repoURL: https://github.com/llorenzinho/kargo-showcase.git
      targetRevision: main
      path: gitops/apps/kargo-showcase/kargo
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
